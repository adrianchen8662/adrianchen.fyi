# The Northeast 115 hike log: one entry per outing, newest or oldest first (it is sorted by date).
# Read by src/lib/ne115.ts. A peak is "hiked" once any hike lists it under summited, and "attempted" if it is only
# ever under attempted. Miles and gain are for the hike as a whole, whatever route it took, so they are counted
# once however many peaks it covers.
#
# Peak names are spelled exactly as in _data/ne115.yml; the build stops on a name it doesn't recognize.
#
# - date: 2026-09-12                       required
#   title: Hale and Zealand                optional
#   route: Lend-a-Hand Trail and Twinway   required: what I actually hiked
#   miles: 11.2                            optional, round trip
#   gain: 3400                             optional, feet of climbing
#   summited:                              peaks I reached the summit of
#     - Mount Hale
#   attempted:                             peaks I set out for and didn't reach
#     - Mount Zealand
#   notes: Turned around short of the Zealand summit.   optional
# Route names are AllTrails' names for the route; titles are my own.
- date: 2025-09-13
  title: Franconia Ridge and Mount Lafayette Trail
  route: Mount Lafayette and Franconia Ridge Trail Loop
  miles: 9.8
  gain: 4009
  summited:
    - Mount Lafayette
    - Mount Lincoln

- date: 2026-06-27
  title: Mount Hale and Almost Mount Zealand
  route: Mount Hale and Mount Zealand Loop via Hale Brook to Zealand Trail
  miles: 13.23
  gain: 3947
  summited:
    - Mount Hale
  attempted:
    - Mount Zealand

- date: 2026-10-10
  title: Whiteface, Lookout and Esther Mountains
  route: Whiteface and Esther Mountains via Marble Mountain Trail
  miles: 11.0
  gain: 3927
  summited:
    - Whiteface Mountain
    - Esther Mountain
